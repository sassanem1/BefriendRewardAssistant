workflows:
  befriend-android-debug:
    name: Befriend Reward Assistant - Android debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Install pinned Gradle 8.9
        script: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version
      - name: Build debug APK
        script: |
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
